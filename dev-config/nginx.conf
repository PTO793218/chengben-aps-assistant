server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    location /api/agent/ {
        proxy_pass http://agent-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
    }
    location /api/speech/ {
        proxy_pass http://speech-ark-backend:8080/api/speech/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location = /api/speech-health {
        proxy_pass http://speech-ark-backend:8080/api/health;
    }
    location / { try_files $uri $uri/ /index.html; }
}
