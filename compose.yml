name: chengben-aps-assistant
services:
  agent-backend:
    build:
      context: .
      dockerfile: dev-config/Dockerfile.agent-backend
      args:
        DOTNET_SDK_IMAGE: ${DOTNET_SDK_IMAGE}
        DOTNET_ASPNET_IMAGE: ${DOTNET_ASPNET_IMAGE}
    environment:
      ASPNETCORE_URLS: http://+:8080
      Agent__Mode: ${AGENT_MODE}
      Agent__Name: WePilot
      Agent__HistoryMaxRounds: ${AGENT_HISTORY_MAX_ROUNDS}
      Agent__SummaryTriggerRounds: ${AGENT_SUMMARY_TRIGGER_ROUNDS}
      Agent__SummaryKeepRecentRounds: ${AGENT_SUMMARY_KEEP_RECENT_ROUNDS}
      Agent__SummaryMaxOutputTokens: ${AGENT_SUMMARY_MAX_OUTPUT_TOKENS}
      SemanticKernel__Endpoint: ${SK_ENDPOINT}
      SemanticKernel__ApiKey: ${SK_API_KEY}
      SemanticKernel__ModelId: ${SK_MODEL_ID}
      SemanticKernel__TimeoutMs: ${SK_TIMEOUT_MS}
      SemanticKernel__MaxOutputTokens: ${SK_MAX_OUTPUT_TOKENS}
      SemanticKernel__Temperature: ${SK_TEMPERATURE}
    ports: ["127.0.0.1:${AGENT_BACKEND_PORT}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /api/health HTTP/1.0\r\nHost: localhost\r\n\r\n\" >&3; head -1 <&3 | grep -q 200'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: { options: { max-size: "10m", max-file: "3" } }
    restart: unless-stopped
  speech-ark-backend:
    build:
      context: .
      dockerfile: dev-config/Dockerfile.speech-ark-backend
      args:
        DOTNET_SDK_IMAGE: ${DOTNET_SDK_IMAGE}
        DOTNET_ASPNET_IMAGE: ${DOTNET_ASPNET_IMAGE}
    environment:
      ASPNETCORE_URLS: http://+:8080
      ArkSpeech__ApiKey: ${ARK_SPEECH_API_KEY}
      ArkSpeech__AsrEndpoint: ${ARK_ASR_ENDPOINT}
      ArkSpeech__AsrResourceId: ${ARK_ASR_RESOURCE_ID}
      ArkSpeech__TtsEndpoint: ${ARK_TTS_ENDPOINT}
      ArkSpeech__TtsResourceId: ${ARK_TTS_RESOURCE_ID}
      ArkSpeech__TtsSpeaker: ${ARK_TTS_SPEAKER}
      ArkSpeech__AsrEndWindowSize: ${ARK_ASR_END_WINDOW_SIZE}
      ArkSpeech__AsrEnableNonstream: ${ARK_ASR_ENABLE_NONSTREAM}
      ArkSpeech__AsrLanguage: ${ARK_ASR_LANGUAGE}
      ArkSpeech__TtsSampleRate: ${ARK_TTS_SAMPLE_RATE}
      ArkSpeech__TtsFormat: ${ARK_TTS_FORMAT}
    ports: ["127.0.0.1:${SPEECH_BACKEND_PORT}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /api/health HTTP/1.0\r\nHost: localhost\r\n\r\n\" >&3; head -1 <&3 | grep -q 200'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: { options: { max-size: "10m", max-file: "3" } }
    restart: unless-stopped
  web-frontend:
    build:
      context: .
      dockerfile: dev-config/Dockerfile.web-frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE}
        NGINX_IMAGE: ${NGINX_IMAGE}
    ports: ["${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_FRONTEND_PORT}:80"]
    depends_on:
      agent-backend: { condition: service_healthy }
      speech-ark-backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: { options: { max-size: "10m", max-file: "3" } }
    restart: unless-stopped
